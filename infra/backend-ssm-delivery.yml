AWSTemplateFormatVersion: '2010-09-09'
Description: Private delivery boundary for the EventiApp backend EC2 host.

Parameters:
  ArtifactBucketName:
    Type: String
    Default: eventiapp-backend-delivery-752279076974-us-east-2
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  RepositoryName:
    Type: String
    Default: eventiapp-events-backend-prod
    AllowedPattern: '^[a-z0-9]+(?:[._-][a-z0-9]+)*$'
  AlertTopicArn:
    Type: String
    Default: arn:aws:sns:us-east-2:752279076974:eventiapp-backend-alerts-prod
  DatabaseInstanceId:
    Type: String
    Default: eventiapp-private-database
  CognitoUserPoolId:
    Type: String
    Default: us-east-1_WIAV72FKe
    AllowedPattern: '^us-east-1_[A-Za-z0-9]+$'

Resources:
  DeliveryArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref ArtifactBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireDeploymentArtifacts
            Status: Enabled
            Prefix: releases/
            ExpirationInDays: 2
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Application
          Value: EventiApp
        - Key: Purpose
          Value: backend-delivery-artifacts

  BackendApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /ec2/eventiapp-backend/prod
      RetentionInDays: 14

  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the 30 newest immutable backend releases","selection":{"tagStatus":"tagged","tagPrefixList":["sha-"],"countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}},{"rulePriority":2,"description":"Expire untagged image remnants","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":2},"action":{"type":"expire"}}]}
      Tags:
        - Key: Application
          Value: EventiApp
        - Key: Environment
          Value: production

  BackendInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eventiapp-backend-production-instance
      Description: Runtime identity for SSM-managed EventiApp backend host.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: PullOnlyBackendRelease
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: GetEcrAuthorizationToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PullOnlyThisRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !GetAtt BackendRepository.Arn
              - Sid: ReadOnlyCurrentDeploymentArtifacts
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${DeliveryArtifactBucket.Arn}/releases/*'
              - Sid: ReadOnlyBackendRuntimeSecret
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/eventiapp/backend/prod/redis-auth-token'
              - Sid: LocateTenantMediaBuckets
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - arn:aws:s3:::itbem-events-bucket-prod
                  - !Sub 'arn:${AWS::Partition}:s3:::eventiapp-*-media-prod-${AWS::AccountId}-${AWS::Region}'
              - Sid: ManageTenantMediaObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:PutObjectTagging
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource:
                  - arn:aws:s3:::itbem-events-bucket-prod/*
                  - !Sub 'arn:${AWS::Partition}:s3:::eventiapp-*-media-prod-${AWS::AccountId}-${AWS::Region}/*'
              - Sid: ManageOnlyProductionCognitoUsers
                Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:AdminEnableUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminUpdateUserAttributes
                Resource: !Sub 'arn:${AWS::Partition}:cognito-idp:us-east-1:${AWS::AccountId}:userpool/${CognitoUserPoolId}'
              - Sid: PublishOnlyBackendQueues
                Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  - !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:itbem-media-images-prod'
                  - !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:itbem-media-videos-prod'
                  - !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:eventiapp-workers-prod'
              - Effect: Allow
                Action: sns:Publish
                Resource: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:eventiapp-prod-worker-jobs'
              - Sid: PublishOnlyBackendOperationalLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource: !GetAtt BackendApplicationLogGroup.Arn
              - Sid: PublishOnlyBackendHostMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: CWAgent
      Tags:
        - Key: Application
          Value: EventiApp
        - Key: Environment
          Value: production

  BackendInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: eventiapp-backend-production-instance
      Roles: [!Ref BackendInstanceRole]

  BackendServerErrorsMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BackendApplicationLogGroup
      FilterPattern: '{ $.status >= 500 }'
      MetricTransformations:
        - MetricNamespace: EventiApp/Backend
          MetricName: ServerErrors
          MetricValue: '1'

  BackendServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: eventiapp-backend-public-5xx-prod
      AlarmDescription: Public backend returned one or more HTTP 5xx responses in five minutes.
      Namespace: EventiApp/Backend
      MetricName: ServerErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopicArn]
      OKActions: [!Ref AlertTopicArn]

  CorrelationTraceQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: EventiApp/Operations/Trace correlation ID
      LogGroupNames:
        - !Ref BackendApplicationLogGroup
        - /ec2/eventiapp-workers/prod
        - /aws/lambda/itbem-media-processor-image-prod
        - /aws/lambda/itbem-media-processor-video-prod
      QueryString: |
        fields @timestamp, service, component, event, correlation_id, request_id, job_id, application, lane, level, msg
        | filter correlation_id = "REPLACE_CORRELATION_ID"
        | sort @timestamp asc
        | limit 500

  OperationalErrorsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: EventiApp/Operations/Errors by component
      LogGroupNames:
        - !Ref BackendApplicationLogGroup
        - /ec2/eventiapp-workers/prod
        - /aws/lambda/itbem-media-processor-image-prod
        - /aws/lambda/itbem-media-processor-video-prod
      QueryString: |
        fields @timestamp, service, component, event, application, lane, job_id, correlation_id, level, msg, error
        | filter level = "ERROR" or event like /failed/
        | sort @timestamp desc
        | limit 200

  SlowRequestsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: EventiApp/Backend/Slow HTTP requests
      LogGroupNames: [!Ref BackendApplicationLogGroup]
      QueryString: |
        fields @timestamp, route, method, status, latency_ms, correlation_id
        | filter event = "http_request_completed" and latency_ms >= 1000
        | sort latency_ms desc
        | limit 200

  WorkerFailuresQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: EventiApp/Workers/Failed jobs
      LogGroupNames: [/ec2/eventiapp-workers/prod]
      QueryString: |
        fields @timestamp, application, lane, job_type, job_id, correlation_id, tenant_code, error
        | filter event = "job_processing_failed"
        | sort @timestamp desc
        | limit 200

  RdsFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: eventiapp-backend-rds-free-storage-prod
      AlarmDescription: PostgreSQL free storage is below 3 GiB.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DatabaseInstanceId
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 3221225472
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopicArn]
      OKActions: [!Ref AlertTopicArn]

  RdsConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: eventiapp-backend-rds-connections-prod
      AlarmDescription: PostgreSQL connections are unusually high for the production database.
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DatabaseInstanceId
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 70
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopicArn]
      OKActions: [!Ref AlertTopicArn]

Outputs:
  ArtifactBucketName:
    Value: !Ref DeliveryArtifactBucket
  BackendRepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
  BackendInstanceProfileArn:
    Value: !GetAtt BackendInstanceProfile.Arn
