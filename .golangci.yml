version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign

# default: none limits linters to ONLY those listed above.
# gosimple is part of staticcheck in golangci-lint v2.
# revive (naming), errcheck, and unused are excluded because this codebase
# has pre-existing naming conventions (e.g. CognitoClientId, MusicUrl) and
# unused variables that would require broad refactoring to fix. Re-enable
# incrementally as the codebase is cleaned up.

issues:
  max-issues-per-linter: 20
  max-same-issues: 5
