# Local development infrastructure — PostgreSQL + Redis/Valkey
# Does NOT run the backend binary (run that with: go run ./cmd/api)
#
# Usage:
#   docker compose up -d        # start infrastructure
#   docker compose down         # stop
#   docker compose down -v      # stop + delete data volumes

services:
  postgres:
    image: postgres:16-alpine
    container_name: itbem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: events_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    container_name: itbem-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
