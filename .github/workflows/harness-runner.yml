name: Harness runner evidence

on:
  pull_request:
    paths:
      - scripts/Test-AgentHarness.ps1
      - scripts/Test-AgentHarnessIsolation.ps1
      - scripts/Start-LocalAIControlPlane.ps1
      - scripts/IsolatedQualificationEnvironment.ps1
      - scripts/Test-IsolatedQualificationEnvironment.ps1
      - .github/workflows/harness-runner.yml
  push:
    branches: [main]
    paths:
      - scripts/Test-AgentHarness.ps1
      - scripts/Test-AgentHarnessIsolation.ps1
      - scripts/Start-LocalAIControlPlane.ps1
      - scripts/IsolatedQualificationEnvironment.ps1
      - scripts/Test-IsolatedQualificationEnvironment.ps1
      - .github/workflows/harness-runner.yml

permissions:
  contents: read

jobs:
  evidence:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Verify offline isolation and fail-closed evidence
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify synthetic rejection and real Go JSON compatibility
        shell: powershell
        run: ./scripts/Test-AgentHarnessIsolation.ps1 -RealGoPath (Get-Command go).Source
      - name: Verify disposable qualification identity boundaries
        shell: powershell
        run: ./scripts/Test-IsolatedQualificationEnvironment.ps1
