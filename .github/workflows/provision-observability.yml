name: Verify self-hosted production health
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the three API and worker endpoints
        run: |
          set -euo pipefail
          for domain in eventiapp.com.mx itbem.com.mx cafettonhouse.com; do
            curl --fail --silent --show-error "https://api.$domain/health" | jq -e '.data.db == "ok" and .data.redis == "ok" and .data.environment == "production"'
            curl --fail --silent --show-error "https://worker.$domain/ready" | jq -e '.status == "ready" and .database_ready and .queue_healthy'
          done
          echo 'Grafana and Prometheus run privately on the Mac mini; AWS alarm provisioning is retired.' >> "$GITHUB_STEP_SUMMARY"
