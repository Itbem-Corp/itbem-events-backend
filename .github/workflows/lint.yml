name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: recursive
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.12'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Test deployment and monitoring safety helpers
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          python -m unittest scripts.deploy.test_render_docker_env
      - name: Validate deployment IAM templates
        run: |
          python -m pip install --disable-pip-version-check cfn-lint==1.53.0
          cfn-lint infra/*.yml
      - name: Install libvips (required by bimg/image processor)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libvips-dev
      - name: Build API packages
        run: go build ./...
      - name: Test API packages
        run: go test ./... -timeout 120s
      - name: Vet API packages
        run: go vet ./...
      - name: Block reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.12.2
          args: --timeout=5m
