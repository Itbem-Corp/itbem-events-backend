name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test deployment and monitoring safety helpers
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          python -m unittest scripts.deploy.test_render_docker_env
      - name: Validate deployment IAM templates
        run: |
          python -m pip install --disable-pip-version-check cfn-lint==1.53.0
          cfn-lint infra/*.yml
      - name: Install libvips (required by bimg/image processor)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libvips-dev
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m
