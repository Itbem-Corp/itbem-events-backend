name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Test deployment and monitoring safety helpers
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          python -m unittest scripts.deploy.test_render_docker_env
      - name: Validate deployment IAM templates
        run: |
          python -m pip install --disable-pip-version-check cfn-lint==1.53.0
          cfn-lint infra/*.yml
      - name: Install libvips (required by bimg/image processor)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libvips-dev
      - name: Block reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
