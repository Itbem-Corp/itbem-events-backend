name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Test deployment and monitoring safety helpers
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          python -m unittest scripts.deploy.test_render_docker_env
      - name: Validate deployment IAM templates
        run: |
          python -m pip install --disable-pip-version-check cfn-lint==1.53.0
          cfn-lint infra/*.yml
      - name: Install libvips (required by bimg/image processor)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libvips-dev
      - name: Block reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Detect Go data races
        run: go test -race ./... -count=1 -timeout 180s
      - name: Qualify isolated AWS transport and role lanes
        env:
          ITBEM_AWS_EMULATOR_PORT: "14567"
        run: sh scripts/qualify-agent-platform-live-aws.sh
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
