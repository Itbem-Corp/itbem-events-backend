name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new PR revision supersedes its old checks. Push validation remains independent.
# Scope the group to this workflow and PR so unrelated checks cannot be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.number != 277 }}
    runs-on: [self-hosted, Linux, X64, itbem-org-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true
      - name: Verify libvips for Go analysis
        run: pkg-config --exists vips
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
