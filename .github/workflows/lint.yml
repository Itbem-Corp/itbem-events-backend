name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new PR revision supersedes its old checks. Push validation remains independent.
# Scope the group to this workflow and PR so unrelated checks cannot be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","itbem-wsl-ci"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Test deployment and monitoring safety helpers
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          python -m unittest scripts.deploy.test_render_docker_env
          python -m unittest scripts.deploy.test_verify_github_app_webhook
      - name: Validate deployment IAM templates
        run: |
          python -m pip install --disable-pip-version-check cfn-lint==1.53.0
          cfn-lint infra/*.yml
      - name: Verify inference diagnostic persistence against PostgreSQL
        run: python3 scripts/test-inference-diagnostics-postgres.py
      - name: Verify inference spend reconciliation against PostgreSQL
        run: python3 scripts/test-inference-spend-postgres.py
      - name: Install libvips (required by bimg/image processor)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libvips-dev
      - name: Block reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Detect Go data races
        run: go test -race ./... -count=1 -timeout 180s
      - name: Verify signed automation authority and recovery against PostgreSQL
        run: >-
          go test -race -tags=integration ./controllers/automation
          -run '^(TestEvaluationRealGatewaySerializesAndAccounts|TestQAObservationProjectionPersistsExactSubjectAndRejectsChangedRecovery|TestReleaseObserverSignedAdmissionRejectsCancelledTaskAndReplayedNonce|TestQASourceSignedGatewayBindsPostgresAuthorityAndIndependentCheckout|TestReleaseProjectionRollsBackEvidenceWhenCurrentPolicyIsMissing|TestDelegatedPublicationPostgresFencesAndReceipts|TestWorkspaceCatalogSignedPostgresRegistrationAndRevocation)$'
          -count=1 -timeout 300s
      - name: Verify release ledger projections after JSONB storage
        run: go test -race -tags=integration ./internal/deliveryledger -run '^TestLedgerProjectionsSurvivePostgreSQLJSONBAndRejectTampering$' -count=1 -timeout 180s
      - name: Verify delegated delivery transactions against PostgreSQL
        run: >-
          go test -race -tags=integration ./controllers/delivery
          -run '^(TestDelegatedQACoordinatorPostgresTransactions|TestDelegatedCodePublicationPostgresContinuation)$'
          -count=1 -timeout 300s
      - name: Qualify isolated AWS transport and role lanes
        env:
          ITBEM_AWS_EMULATOR_PORT: ${{ runner.name == 'bema-private-ci-linux-2' && '14568' || '14567' }}
        run: sh scripts/qualify-agent-platform-live-aws.sh
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
