name: Monitor production TLS certificates
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-tls-certificate-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate chains, hostnames and renewal windows
        run: |
          set -euo pipefail
          for domain in eventiapp.com.mx itbem.com.mx cafettonhouse.com; do
            python3 scripts/check_tls_certificate.py --host "api.$domain" --warning-days 30 --timeout 10 --output "$RUNNER_TEMP/tls-$domain.json"
          done
