name: Deploy Backend to Mac mini

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm this revision should be deployed to production
        required: true
        default: false
        type: boolean

# Production deploys must never race each other. A queued deployment is safer
# than cancelling a run while it is between candidate validation and promotion.
concurrency:
  group: mac-mini-backend-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  artifact-metadata: write
  contents: read

env:
  IMAGE_REPOSITORY: eventiapp-events-backend-prod

jobs:
  validate:
    name: Build & test
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      agent_release_sha256: ${{ steps.agent_release.outputs.sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Record validated revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install libvips build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev pkg-config

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -timeout 120s

      - name: Verify inference diagnostic persistence against PostgreSQL
        run: python3 scripts/test-inference-diagnostics-postgres.py

      - name: Verify inference spend reconciliation against PostgreSQL
        run: python3 scripts/test-inference-spend-postgres.py

      - name: Verify cache contract against Valkey
        run: |
          set -euo pipefail
          docker run --rm -d --name eventiapp-valkey-compat -p 127.0.0.1:16380:6379 valkey/valkey:7.2-alpine
          trap 'docker rm -f eventiapp-valkey-compat >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if docker exec eventiapp-valkey-compat valkey-cli ping | grep -qx PONG; then
              VALKEY_INTEGRATION_ADDR=127.0.0.1:16380 \
                go test ./repositories/redisrepository -run '^TestValkeyCompatibility$' -count=1
              exit 0
            fi
            sleep 1
          done
          echo 'Valkey compatibility container did not become ready' >&2
          exit 1

      - name: Block reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Test deployment safety gates
        run: |
          bash scripts/deploy/deploy-ec2-candidate_test.sh
          python3 -m unittest scripts/deploy/test_render_docker_env.py scripts/tests/test_rds_recovery.py
          python3 -m unittest scripts/deploy/test_pull_mac_release.py
          python3 -m unittest scripts/deploy/test_runtime_findings.py

      - name: Test fail-closed alert verifier
        env:
          PYTHONPATH: scripts
        run: python3 -m unittest scripts/tests/test_verify_alerting.py

      - name: Test Linux agent release artifact contract
        run: python3 -m unittest scripts/tests/test_agent_release_workflow.py

      # The Linux execution host never builds from an ambient checkout. Publish
      # a digest-bound binary only after this exact revision passed every
      # validation above; the host installer verifies this manifest before it
      # changes the active release symlink.
      - name: Build Linux agent release artifact
        id: agent_release
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/itbem-ai-agent-release"
          install -d -m 0700 "$release_dir"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=true \
            -o "$release_dir/itbem-ai-agent" ./cmd/itbem-ai-agent

          embedded_revision="$(go version -m "$release_dir/itbem-ai-agent" | \
            awk '$1 == "build" && $2 ~ /^vcs.revision=/ { sub(/^vcs.revision=/, "", $2); print $2; exit }')"
          [[ "$embedded_revision" == "$REVISION" ]] || {
            echo "Linux agent binary does not identify the validated revision" >&2
            exit 1
          }

          digest="$(sha256sum "$release_dir/itbem-ai-agent" | awk '{print $1}')"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || {
            echo "Linux agent release digest is invalid" >&2
            exit 1
          }
          printf '%s\n' "$digest  itbem-ai-agent" > "$release_dir/itbem-ai-agent.sha256"
          printf '{\n  "schema_version": 1,\n  "source_revision": "%s",\n  "sha256": "%s",\n  "target": "linux/amd64"\n}\n' \
            "$REVISION" "$digest" > "$release_dir/release-manifest.json"
          python3 -m json.tool "$release_dir/release-manifest.json" >/dev/null
          echo "directory=$release_dir" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Publish validated Linux agent release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: itbem-ai-agent-release-${{ steps.revision.outputs.sha }}
          path: ${{ steps.agent_release.outputs.directory }}
          if-no-files-found: error
          retention-days: 30

  runtime-image:
    name: Build and scan production image
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - name: Build the validated runtime image
        env:
          REVISION: ${{ needs.validate.outputs.revision }}
        run: docker build --pull --build-arg "SOURCE_REVISION=$REVISION" --tag "eventiapp-api:sha-$REVISION" .
      - name: Scan all high and critical runtime vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: eventiapp-api:sha-${{ needs.validate.outputs.revision }}
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: json
          output: ${{ runner.temp }}/runtime-vulnerabilities.json
          scanners: vuln
          version: v0.69.3
      - name: Block high and critical findings with available fixes
        run: python3 scripts/deploy/check-runtime-findings.py "$RUNNER_TEMP/runtime-vulnerabilities.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: runtime-vulnerability-report-${{ needs.validate.outputs.revision }}
          path: ${{ runner.temp }}/runtime-vulnerabilities.json
          if-no-files-found: error
          retention-days: 7
      - name: Export the scanned image
        env:
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          set -euo pipefail
          docker save "eventiapp-api:sha-$REVISION" | gzip -1 > "$RUNNER_TEMP/docker-image.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-api-runtime-${{ needs.validate.outputs.revision }}
          path: ${{ runner.temp }}/docker-image.tar.gz
          if-no-files-found: error
          retention-days: 1


  deploy:
    name: Publish and verify Mac mini release
    needs: [validate, runtime-image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_production == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
          submodules: recursive
      - name: Record approved Linux agent artifact
        env:
          AGENT_RELEASE_SHA256: ${{ needs.validate.outputs.agent_release_sha256 }}
        run: |
          set -euo pipefail
          [[ "$AGENT_RELEASE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          echo "Validated agent artifact SHA-256: $AGENT_RELEASE_SHA256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mac-api-runtime-${{ needs.validate.outputs.revision }}
          path: ${{ runner.temp }}
      - name: Load the scanned runtime image
        run: docker load --input "$RUNNER_TEMP/docker-image.tar.gz"
      - name: Publish the approved immutable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deploy/publish-mac-release.py --service api --image "eventiapp-api:sha-$GITHUB_SHA" --archive "$RUNNER_TEMP/docker-image.tar.gz"
      - name: Wait for the Mac to promote this exact revision
        if: steps.release.outputs.published == 'true'
        env:
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          set -euo pipefail
          for attempt in {1..120}; do
            ready=true
            for domain in eventiapp.com.mx itbem.com.mx cafettonhouse.com; do
              if ! curl --fail --silent --show-error --max-time 10 "https://api.$domain/health" |
                jq -e --arg revision "$REVISION" '.data | .db == "ok" and .redis == "ok" and .environment == "production" and .source_revision == $revision' >/dev/null; then
                ready=false
              fi
            done
            if [[ "$ready" == true ]]; then exit 0; fi
            sleep 5
          done
          echo 'The Mac has not confirmed this revision. Check its pull-deploy status and rollback log.' >&2
          exit 1
