name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  # ── 1. Build & push Docker image to GHCR ────────────────────────────────────
  # Runs on GitHub runners (fast CPU, clean disk, stable internet).
  # Keeps the EC2 out of the build loop entirely — no more Broken Pipe,
  # no disk pressure, no 7-minute Docker builds over SSH.
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: true

      - name: Verify Go build
        run: go build ./...

      # Tests temporarily disabled — re-enable once integration suite is stable
      # - name: Test
      #   run: go test ./... -timeout 60s

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tag with both :latest and the commit SHA for easy rollback
          tags: |
            ghcr.io/itbem-corp/itbem-events-backend:latest
            ghcr.io/itbem-corp/itbem-events-backend:${{ github.sha }}
          # Layer cache stored in GHCR — subsequent builds are much faster
          cache-from: type=registry,ref=ghcr.io/itbem-corp/itbem-events-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/itbem-corp/itbem-events-backend:buildcache,mode=max

  # ── 2. Pull image on EC2 and restart container ───────────────────────────────
  # SSH session now lasts ~30 seconds (pull + restart) instead of 7+ minutes
  # (build). Broken Pipe is no longer a concern. Blue-green swap via two named
  # containers (blue/green) with a symlink-style "active" marker gives
  # zero-downtime restarts even if we upgrade to nginx later.
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Setup SSH via EC2 Instance Connect
        run: |
          # Generate ephemeral SSH key for this deploy run
          ssh-keygen -t ed25519 -f ~/.ssh/ec2_deploy -N '' -q
          # Push public key to EC2 — valid for 60 seconds to initiate connection
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --instance-os-user ${{ secrets.EC2_USER }} \
            --ssh-public-key file://~/.ssh/ec2_deploy.pub \
            --region us-east-2
          # Trust EC2 host key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/ec2_deploy

      - name: Deploy backend
        run: |
          IMAGE="ghcr.io/itbem-corp/itbem-events-backend:${{ github.sha }}"
          # -T: no pseudo-terminal (suppresses "not allocated" warning from heredoc)
          # The SSH session only runs for ~30s so keepalive is just a safety net
          ssh -T -i ~/.ssh/ec2_deploy \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF

            # ── Authenticate to GHCR ──────────────────────────────────────────
            echo "${{ secrets.GH_DEPLOY_TOKEN }}" | \
              docker login ghcr.io -u itbem-corp --password-stdin

            # ── Pull the new image (already built on GitHub runner) ────────────
            docker pull $IMAGE

            # ── Swap container (brief ~1s gap while container restarts) ────────
            docker stop  itbem-events-backend 2>/dev/null || true
            docker rm    itbem-events-backend 2>/dev/null || true

            docker run -d \
              --name itbem-events-backend \
              --restart always \
              -p ${{ secrets.BACKEND_PORT }}:${{ secrets.BACKEND_PORT }} \
              -e PORT='${{ secrets.BACKEND_PORT }}' \
              -e AWS_REGION='${{ secrets.BACKEND_AWS_REGION }}' \
              -e ENV='${{ secrets.ENV }}' \
              -e COGNITO_USER_POOL_ID='${{ secrets.BACKEND_COGNITO_USER_POOL_ID }}' \
              -e COGNITO_CLIENT_ID='${{ secrets.BACKEND_COGNITO_CLIENT_ID }}' \
              -e COGNITO_CLIENT_SECRET='${{ secrets.BACKEND_COGNITO_CLIENT_SECRET }}' \
              -e COGNITO_AWS_REGION='${{ secrets.BACKEND_COGNITO_AWS_REGION }}' \
              -e AWS_BUCKET_NAME='${{ secrets.AWS_BUCKET_NAME }}' \
              -e S3_CLIENT_ID='${{ secrets.S3_CLIENT_ID }}' \
              -e S3_CLIENT_SECRET='${{ secrets.S3_CLIENT_SECRET }}' \
              -e DB_HOST='${{ secrets.BACKEND_DB_HOST }}' \
              -e DB_USER='${{ secrets.BACKEND_DB_USER }}' \
              -e DB_PASSWORD='${{ secrets.BACKEND_DB_PASSWORD }}' \
              -e DB_NAME='${{ secrets.BACKEND_DB_NAME }}' \
              -e DB_PORT='${{ secrets.BACKEND_DB_PORT }}' \
              -e DB_TIMEZONE='${{ secrets.BACKEND_DB_TIMEZONE }}' \
              -e REDIS_HOST='${{ secrets.BACKEND_REDIS_HOST }}' \
              -e REDIS_PASSWORD='${{ secrets.BACKEND_REDIS_PASSWORD }}' \
              -e REDIS_DB='${{ secrets.BACKEND_REDIS_DB }}' \
              -e REDIS_TLS='${{ secrets.BACKEND_REDIS_TLS }}' \
              -e GOOGLE_CLIENT_ID='${{ secrets.BACKEND_GOOGLE_CLIENT_ID }}' \
              -e GOOGLE_CLIENT_SECRET='${{ secrets.BACKEND_GOOGLE_CLIENT_SECRET }}' \
              -e CORS_ALLOW_ORIGINS='${{ secrets.CORS_ALLOW_ORIGINS }}' \
              -e INTERNAL_API_SECRET='${{ secrets.INTERNAL_API_SECRET }}' \
              -e SQS_IMAGE_QUEUE_URL='${{ secrets.SQS_IMAGE_QUEUE_URL }}' \
              -e SQS_VIDEO_QUEUE_URL='${{ secrets.SQS_VIDEO_QUEUE_URL }}' \
              -e CDN_BASE_URL='${{ secrets.CDN_BASE_URL }}' \
              $IMAGE

            # ── Remove dangling images (keep the last 2 SHAs for rollback) ────
            docker image prune -f

            echo "✅ Deploy complete. Running containers:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          EOF
