name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm this revision should be deployed to production
        required: true
        default: false
        type: boolean

# Production deploys must never race each other. A queued deployment is safer
# than cancelling a run while it is between candidate validation and promotion.
concurrency:
  group: eventiapp-backend-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: eventiapp-events-backend-prod

jobs:
  validate:
    name: Build & test
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record validated revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.12'
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -timeout 120s

      - name: Verify cache contract against Valkey
        run: |
          set -euo pipefail
          docker run --rm -d --name eventiapp-valkey-compat -p 127.0.0.1:16380:6379 valkey/valkey:7.2-alpine
          trap 'docker rm -f eventiapp-valkey-compat >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if docker exec eventiapp-valkey-compat valkey-cli ping | grep -qx PONG; then
              VALKEY_INTEGRATION_ADDR=127.0.0.1:16380 \
                go test ./repositories/redisrepository -run '^TestValkeyCompatibility$' -count=1
              exit 0
            fi
            sleep 1
          done
          echo 'Valkey compatibility container did not become ready' >&2
          exit 1

      - name: Block reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Test deployment safety gates
        run: |
          bash scripts/deploy/deploy-ec2-candidate_test.sh
          python3 -m unittest scripts/deploy/test_render_docker_env.py

      - name: Test fail-closed alert verifier
        env:
          PYTHONPATH: scripts
        run: python3 -m unittest scripts/tests/test_verify_alerting.py

  deploy:
    name: Deploy candidate and promote
    needs: validate
    # Main is the production promotion lane. A manual run remains available for
    # incident response, but still requires its explicit confirmation.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.confirm_production == true))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false

      - name: Setup Go for production security preflight
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.12'
          cache: true

      - name: Validate independent production secrets
        env:
          ENV: production
          EVENT_PREVIEW_SECRET: ${{ secrets.EVENT_PREVIEW_SECRET }}
          EVENT_ACCESS_SECRET: ${{ secrets.EVENT_ACCESS_SECRET }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          ORGANIZATION_CONTEXT_SECRET: ${{ secrets.ORGANIZATION_CONTEXT_SECRET }}
          ORGANIZATION_CONTEXT_SECRET_PREVIOUS: ${{ secrets.ORGANIZATION_CONTEXT_SECRET_PREVIOUS }}
          INTERNAL_API_SECRET_PREVIOUS: ${{ secrets.INTERNAL_API_SECRET_PREVIOUS }}
        run: go run ./cmd/security-preflight

      # Build the immutable image on the runner. The EC2 host no longer clones
      # the repository or persists a GitHub PAT in ~/.git-credentials.
      - name: Build deployment image
        env:
          REVISION: ${{ needs.validate.outputs.revision }}
          IMAGE_TAG: ${{ env.IMAGE_REPOSITORY }}:sha-${{ needs.validate.outputs.revision }}
        run: |
          docker build --pull --build-arg "SOURCE_REVISION=$REVISION" --tag "$IMAGE_TAG" .
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_TAG")" == "$REVISION" ]]

      - name: Require the provisioned production deployment boundary
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          DB_INSTANCE_ID: ${{ vars.BACKEND_DB_INSTANCE_ID }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          BACKEND_CANDIDATE_PORT: ${{ vars.BACKEND_CANDIDATE_PORT || '18080' }}
        run: |
          set -euo pipefail
          test -n "$AWS_DEPLOY_ROLE_ARN" || { echo "AWS_DEPLOY_ROLE_ARN environment variable is required"; exit 1; }
          [[ "$AWS_DEPLOY_ROLE_ARN" == arn:aws*:iam::*:role/eventiapp-github-backend-production ]] || {
            echo "AWS_DEPLOY_ROLE_ARN is not the provisioned backend production role"
            exit 1
          }
          test -n "$DB_INSTANCE_ID" || { echo "BACKEND_DB_INSTANCE_ID environment variable is required"; exit 1; }
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]] || { echo "EC2_INSTANCE_ID is invalid"; exit 1; }
          [[ "$EC2_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || { echo "EC2_USER is invalid"; exit 1; }
          [[ "$EC2_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "EC2_HOST is invalid"; exit 1; }
          [[ "$BACKEND_PORT" =~ ^[0-9]{2,5}$ && "$BACKEND_PORT" -le 65535 ]] || { echo "BACKEND_PORT is invalid"; exit 1; }
          [[ "$BACKEND_CANDIDATE_PORT" =~ ^[0-9]{2,5}$ && "$BACKEND_CANDIDATE_PORT" -le 65535 ]] || { echo "BACKEND_CANDIDATE_PORT is invalid"; exit 1; }
          [[ "$BACKEND_PORT" != "$BACKEND_CANDIDATE_PORT" ]] || { echo "candidate and production ports must differ"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@f79bc868ee9ca4687c7db10f05fe6a46cdcda892 # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: eventiapp-backend-${{ github.run_id }}
          aws-region: us-east-2

      - name: Require confirmed host and public-health alert routes
        env:
          BACKEND_ALERT_EMAIL: ${{ secrets.BACKEND_ALERT_EMAIL }}
          EXPECTED_EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          HOST_STACK=eventiapp-backend-prod-observability
          HOST_INSTANCE_ID="$(aws cloudformation describe-stacks \
            --stack-name "$HOST_STACK" \
            --region us-east-2 \
            --query "Stacks[0].Outputs[?OutputKey=='MonitoredEC2InstanceId'].OutputValue" \
            --output text)"
          [[ "$HOST_INSTANCE_ID" == "$EXPECTED_EC2_INSTANCE_ID" ]] || {
            echo "Host alarm monitors ${HOST_INSTANCE_ID:-<missing>}, expected ${EXPECTED_EC2_INSTANCE_ID}" >&2
            exit 1
          }
          HOST_TOPIC_ARN="$(aws cloudformation describe-stacks \
            --stack-name "$HOST_STACK" \
            --region us-east-2 \
            --query "Stacks[0].Outputs[?OutputKey=='AlertTopicArn'].OutputValue" \
            --output text)"
          AWS_REGION=us-east-2 AWS_DEFAULT_REGION=us-east-2 python3 scripts/verify_alerting.py \
            --topic-arn "$HOST_TOPIC_ARN" \
            --email "$BACKEND_ALERT_EMAIL" \
            --alarm-prefix "eventiapp-backend-" \
            --alarm-suffix=-prod \
            --expected-alarm "eventiapp-backend-ec2-system-status-prod" \
            --expected-alarm "eventiapp-backend-ec2-instance-status-prod" \
            --expected-alarm "eventiapp-backend-host-prod" \
            --expected-alarm "eventiapp-backend-public-5xx-prod" \
            --expected-alarm "eventiapp-backend-rds-free-storage-prod" \
            --expected-alarm "eventiapp-backend-rds-connections-prod" \
            --expected-alarm "eventiapp-backend-audit-persistence-failures-prod" \
            --routed-alarm "eventiapp-backend-host-prod" \
            --routed-alarm "eventiapp-backend-public-5xx-prod" \
            --routed-alarm "eventiapp-backend-rds-free-storage-prod" \
            --routed-alarm "eventiapp-backend-rds-connections-prod" \
            --routed-alarm "eventiapp-backend-audit-persistence-failures-prod"

          PUBLIC_STACK=eventiapp-backend-prod-public-health-observability
          MONITORED_FQDN="$(aws cloudformation describe-stacks \
            --stack-name "$PUBLIC_STACK" \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='MonitoredFQDN'].OutputValue" \
            --output text)"
          [[ "$MONITORED_FQDN" == "api.eventiapp.com.mx" ]] || {
            echo "Public-health alarm monitors ${MONITORED_FQDN:-<missing>}, expected api.eventiapp.com.mx" >&2
            exit 1
          }
          PUBLIC_TOPIC_ARN="$(aws cloudformation describe-stacks \
            --stack-name "$PUBLIC_STACK" \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='AlertTopicArn'].OutputValue" \
            --output text)"
          AWS_REGION=us-east-1 AWS_DEFAULT_REGION=us-east-1 python3 scripts/verify_alerting.py \
            --topic-arn "$PUBLIC_TOPIC_ARN" \
            --email "$BACKEND_ALERT_EMAIL" \
            --alarm-prefix "eventiapp-backend-public-health-" \
            --alarm-suffix=-prod \
            --expected-alarm "eventiapp-backend-public-health-prod" \
            --routed-alarm "eventiapp-backend-public-health-prod"

      - name: Publish immutable image to ECR
        id: image
        env:
          REVISION: ${{ needs.validate.outputs.revision }}
          IMAGE_TAG: ${{ env.IMAGE_REPOSITORY }}:sha-${{ needs.validate.outputs.revision }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.us-east-2.amazonaws.com"
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.us-east-2.amazonaws.com/${IMAGE_REPOSITORY}"
          aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          DIGEST="$(aws ecr describe-images \
            --repository-name "$IMAGE_REPOSITORY" \
            --image-ids imageTag="sha-${REVISION}" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)"
          if [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            docker pull "$ECR_URI@$DIGEST" >/dev/null
            REMOTE_REVISION="$(docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "$ECR_URI@$DIGEST")"
            [[ "$REMOTE_REVISION" == "$REVISION" ]] || {
              echo 'Existing immutable image does not identify the requested revision' >&2
              exit 1
            }
            echo "Reusing verified immutable image $ECR_URI@$DIGEST"
          else
            docker tag "$IMAGE_TAG" "$ECR_URI:sha-${REVISION}"
            docker push "$ECR_URI:sha-${REVISION}"
            DIGEST="$(aws ecr describe-images --repository-name "$IMAGE_REPOSITORY" --image-ids imageTag="sha-${REVISION}" --query 'imageDetails[0].imageDigest' --output text)"
          fi
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "ECR did not return an immutable digest" >&2; exit 1; }
          echo "reference=${ECR_URI}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Load runtime secret from Parameter Store
        shell: bash
        run: |
          set -euo pipefail
          redis_password="$(aws ssm get-parameter \
            --name /eventiapp/backend/prod/redis-auth-token \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)"
          test "${#redis_password}" -ge 32
          echo "::add-mask::$redis_password"
          echo "REDIS_PASSWORD=$redis_password" >> "$GITHUB_ENV"

      - name: Render runtime environment without shell interpolation
        env:
          PORT: ${{ vars.BACKEND_PORT }}
          AWS_REGION: ${{ secrets.BACKEND_AWS_REGION }}
          S3_REGION: ${{ secrets.BACKEND_S3_REGION }}
          ENV: production
          SOURCE_REVISION: ${{ needs.validate.outputs.revision }}
          COGNITO_USER_POOL_ID: ${{ secrets.BACKEND_COGNITO_USER_POOL_ID }}
          COGNITO_AWS_REGION: ${{ secrets.BACKEND_COGNITO_AWS_REGION }}
          COGNITO_ALLOWED_CLIENT_IDS: ${{ secrets.BACKEND_COGNITO_ALLOWED_CLIENT_IDS }}
          COGNITO_TENANT_CLIENT_MAP: ${{ secrets.BACKEND_COGNITO_TENANT_CLIENT_MAP }}
          TENANT_HOST_MAP: ${{ secrets.BACKEND_TENANT_HOST_MAP }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          TENANT_BUCKET_MAP: ${{ secrets.BACKEND_TENANT_BUCKET_MAP }}
          CDN_BASE_URL: ${{ secrets.CDN_BASE_URL }}
          DB_HOST: ${{ secrets.BACKEND_DB_HOST }}
          DB_USER: ${{ secrets.BACKEND_DB_USER }}
          DB_PASSWORD: ${{ secrets.BACKEND_DB_PASSWORD }}
          DB_NAME: ${{ secrets.BACKEND_DB_NAME }}
          DB_PORT: ${{ secrets.BACKEND_DB_PORT }}
          DB_TIMEZONE: ${{ secrets.BACKEND_DB_TIMEZONE }}
          REDIS_HOST: ${{ secrets.BACKEND_REDIS_HOST }}
          REDIS_DB: ${{ secrets.BACKEND_REDIS_DB }}
          REDIS_TLS: ${{ secrets.BACKEND_REDIS_TLS }}
          GOOGLE_CLIENT_ID: ${{ secrets.BACKEND_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.BACKEND_GOOGLE_CLIENT_SECRET }}
          CORS_ALLOW_ORIGINS: ${{ secrets.CORS_ALLOW_ORIGINS }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          INTERNAL_API_SECRET_PREVIOUS: ${{ secrets.INTERNAL_API_SECRET_PREVIOUS }}
          EVENT_PREVIEW_SECRET: ${{ secrets.EVENT_PREVIEW_SECRET }}
          EVENT_ACCESS_SECRET: ${{ secrets.EVENT_ACCESS_SECRET }}
          ORGANIZATION_CONTEXT_SECRET: ${{ secrets.ORGANIZATION_CONTEXT_SECRET }}
          ORGANIZATION_CONTEXT_SECRET_PREVIOUS: ${{ secrets.ORGANIZATION_CONTEXT_SECRET_PREVIOUS }}
          SQS_IMAGE_QUEUE_URL: ${{ secrets.SQS_IMAGE_QUEUE_URL }}
          SQS_VIDEO_QUEUE_URL: ${{ secrets.SQS_VIDEO_QUEUE_URL }}
          SQS_WORKER_QUEUE_URL: ${{ secrets.SQS_WORKER_QUEUE_URL }}
          SNS_WORKER_TOPIC_ARN: ${{ secrets.SNS_WORKER_TOPIC_ARN }}
        run: |
          set -euo pipefail
          LOCAL_ENV_FILE="${RUNNER_TEMP}/eventiapp-backend-${GITHUB_RUN_ID}.env"
          python3 scripts/deploy/render_docker_env.py \
            --output "$LOCAL_ENV_FILE" \
            --required PORT \
            --required AWS_REGION \
            --required S3_REGION \
            --required ENV \
            --required SOURCE_REVISION \
            --required COGNITO_USER_POOL_ID \
            --required COGNITO_AWS_REGION \
            --required AWS_BUCKET_NAME \
            --required TENANT_BUCKET_MAP \
            --required DB_HOST \
            --required DB_USER \
            --required DB_PASSWORD \
            --required DB_NAME \
            --required DB_PORT \
            --required DB_TIMEZONE \
            --required REDIS_HOST \
            --required REDIS_DB \
            --required REDIS_TLS \
            --required GOOGLE_CLIENT_ID \
            --required GOOGLE_CLIENT_SECRET \
            --required INTERNAL_API_SECRET \
            --required EVENT_PREVIEW_SECRET \
            --required EVENT_ACCESS_SECRET \
            --required ORGANIZATION_CONTEXT_SECRET \
            --optional ORGANIZATION_CONTEXT_SECRET_PREVIOUS \
            --required SQS_IMAGE_QUEUE_URL \
            --required SQS_VIDEO_QUEUE_URL \
            --required COGNITO_ALLOWED_CLIENT_IDS \
            --required COGNITO_TENANT_CLIENT_MAP \
            --required TENANT_HOST_MAP \
            --optional CDN_BASE_URL \
            --optional CORS_ALLOW_ORIGINS \
            --optional REDIS_PASSWORD \
            --optional INTERNAL_API_SECRET_PREVIOUS \
            --optional SQS_WORKER_QUEUE_URL \
            --required SNS_WORKER_TOPIC_ARN

      - name: Snapshot database before startup migrations
        id: database_snapshot
        env:
          DB_INSTANCE_ID: ${{ vars.BACKEND_DB_INSTANCE_ID }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          set -euo pipefail
          test -n "$DB_INSTANCE_ID" || { echo "BACKEND_DB_INSTANCE_ID is required"; exit 1; }

          # Each automatic release takes a rollback snapshot. Keep the bounded
          # predeploy namespace for seven days so normal delivery cadence cannot
          # turn manual RDS snapshots into unbounded storage cost.
          CUTOFF="$(date --utc --date='7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          while IFS= read -r snapshot; do
            [[ "$snapshot" == eventiapp-predeploy-* ]] || {
              echo "Refusing to delete an unexpected snapshot identifier" >&2
              exit 1
            }
            aws rds delete-db-snapshot --db-snapshot-identifier "$snapshot"
          done < <(aws rds describe-db-snapshots \
            --db-instance-identifier "$DB_INSTANCE_ID" \
            --snapshot-type manual \
            --query "DBSnapshots[?starts_with(DBSnapshotIdentifier, 'eventiapp-predeploy-') && SnapshotCreateTime<=\`${CUTOFF}\`].DBSnapshotIdentifier" \
            --output json | jq -r '.[]')

          SNAPSHOT_ID="eventiapp-predeploy-${REVISION:0:12}-${GITHUB_RUN_ID}"
          aws rds create-db-snapshot \
            --db-instance-identifier "$DB_INSTANCE_ID" \
            --db-snapshot-identifier "$SNAPSHOT_ID" \
            --tags Key=Application,Value=EventiApp Key=Purpose,Value=predeploy-rollback Key=Revision,Value="$REVISION"
          aws rds wait db-snapshot-available --db-snapshot-identifier "$SNAPSHOT_ID"
          echo "snapshot_id=$SNAPSHOT_ID" >> "$GITHUB_OUTPUT"
          echo "Database rollback snapshot: \`$SNAPSHOT_ID\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy through SSM, health-gate promotion, and rollback on failure
        env:
          REVISION: ${{ needs.validate.outputs.revision }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          BACKEND_CANDIDATE_PORT: ${{ vars.BACKEND_CANDIDATE_PORT || '18080' }}
          DELIVERY_BUCKET: eventiapp-backend-delivery-752279076974-us-east-2
        run: |
          set -euo pipefail
          LOCAL_ENV_FILE="${RUNNER_TEMP}/eventiapp-backend-${GITHUB_RUN_ID}.env"
          test -r "$LOCAL_ENV_FILE" || { echo "rendered runtime environment is missing"; exit 1; }
          PREFIX="releases/${GITHUB_RUN_ID}"
          ENV_KEY="${PREFIX}/runtime.env"
          SCRIPT_KEY="${PREFIX}/deploy-ec2-candidate.sh"
          aws s3 cp "$LOCAL_ENV_FILE" "s3://${DELIVERY_BUCKET}/${ENV_KEY}" --only-show-errors
          aws s3 cp scripts/deploy/deploy-ec2-candidate.sh "s3://${DELIVERY_BUCKET}/${SCRIPT_KEY}" --only-show-errors
          remote_script="$(cat <<REMOTE
          set -Eeuo pipefail
          deploy_dir='/var/lib/eventiapp-deploy/${GITHUB_RUN_ID}'
          install -d -m 700 "\$deploy_dir"
          trap 'rm -rf "\$deploy_dir"' EXIT
          aws s3 cp 's3://${DELIVERY_BUCKET}/${ENV_KEY}' "\$deploy_dir/runtime.env" --only-show-errors
          aws s3 cp 's3://${DELIVERY_BUCKET}/${SCRIPT_KEY}' "\$deploy_dir/deploy.sh" --only-show-errors
          chmod 600 "\$deploy_dir/runtime.env"
          chmod 700 "\$deploy_dir/deploy.sh"
          command -v docker >/dev/null 2>&1 || sudo yum install -y docker
          command -v curl >/dev/null 2>&1 || sudo yum install -y curl
          command -v python3 >/dev/null 2>&1 || sudo yum install -y python3
          sudo systemctl enable --now docker
          ECR_REGISTRY="${IMAGE_REFERENCE%%/*}"
          aws ecr get-login-password --region us-east-2 | sudo docker login --username AWS --password-stdin "\$ECR_REGISTRY"
          sudo docker pull '${IMAGE_REFERENCE}'
          IMAGE_TAG='${IMAGE_REFERENCE}' BACKEND_PORT='${BACKEND_PORT}' CANDIDATE_PORT='${BACKEND_CANDIDATE_PORT}' DEPLOY_ID='${GITHUB_RUN_ID}' ENV_FILE="\$deploy_dir/runtime.env" AWS_REGION='us-east-2' LOG_GROUP='/ec2/eventiapp-backend/prod' INSTANCE_ID='${{ vars.EC2_INSTANCE_ID }}' bash "\$deploy_dir/deploy.sh"
          deployed_revision="\$(sudo docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' itbem-events-backend)"
          [[ "\$deployed_revision" == '${REVISION}' ]]
          printf 'deployed_revision=%s\n' "\$deployed_revision"
          REMOTE
          )"
          remote_payload="$(printf '%s' "$remote_script" | base64 -w 0)"
          [[ "$remote_payload" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] || {
            echo 'Could not encode the remote deployment command' >&2
            exit 1
          }
          ssm_command="echo '$remote_payload' | base64 --decode | bash"
          ssm_parameters="$(jq -cn --arg command "$ssm_command" '{commands: [$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids '${{ vars.EC2_INSTANCE_ID }}' \
            --document-name AWS-RunShellScript \
            --comment "EventiApp backend ${GITHUB_RUN_ID}" \
            --parameters "$ssm_parameters" \
            --timeout-seconds 1800 \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id '${{ vars.EC2_INSTANCE_ID }}'
          invocation_output="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id '${{ vars.EC2_INSTANCE_ID }}' --query StandardOutputContent --output text)"
          printf '%s\n' "$invocation_output"
          grep -Fqx "deployed_revision=$REVISION" <<<"$invocation_output"

      - name: Remove ephemeral delivery artifacts
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/eventiapp-backend-${GITHUB_RUN_ID}.env"
          prefix="s3://eventiapp-backend-delivery-752279076974-us-east-2/releases/${GITHUB_RUN_ID}"
          aws s3 rm "$prefix/runtime.env" --only-show-errors || true
          aws s3 rm "$prefix/deploy.sh" --only-show-errors || true
